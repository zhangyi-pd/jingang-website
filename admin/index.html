<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 | 金刚般若</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', serif;
            background: #fefaf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            border: 1px solid #f3ede6;
            width: 380px;
            max-width: 90vw;
        }
        .login-box h1 {
            text-align: center;
            color: #8b6b4d;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .login-box .sub {
            text-align: center;
            color: #b19274;
            font-size: 0.85rem;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #5d4636;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2d9cf;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus {
            border-color: #b2753c;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #8b6b4d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        .btn:hover { background: #7a5a3e; }
        .error { color: #c0392b; font-size: 0.85rem; text-align: center; margin-top: 12px; display: none; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b19274;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: #8b6b4d; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🙏 管理员</h1>
        <p class="sub">金刚般若 · 内容管理</p>
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" value="admin" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" value="admin123" required>
            </div>
            <button type="submit" class="btn">登 录</button>
            <p class="error" id="errorMsg">用户名或密码错误</p>
        </form>
        <a href="/" class="back-link">← 返回网站首页</a>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if (res.ok) {
                window.location.href = '/admin/dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
