<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 | 金刚般若</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', serif;
            background: #fefaf5;
            color: #2e241f;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: white;
            border-right: 1px solid #f3ede6;
            padding: 32px 20px;
        }
        .sidebar h2 {
            color: #8b6b4d;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 32px;
            text-align: center;
        }
        .sidebar h2 small {
            display: block;
            font-size: 0.75rem;
            color: #b19274;
            margin-top: 4px;
            font-weight: 300;
        }
        .nav-item {
            display: block;
            padding: 12px 16px;
            color: #5d4636;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 4px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .nav-item i { width: 24px; color: #b19274; }
        .nav-item:hover, .nav-item.active {
            background: #f8f2ea;
            color: #8b6b4d;
        }
        .nav-item.logout { margin-top: 40px; color: #c0392b; }
        .nav-item.logout:hover { background: #fdf0ed; }
        .main {
            flex: 1;
            padding: 32px 40px;
        }
        .main h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #7a5a3e;
            margin-bottom: 32px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            border: 1px solid #f3ede6;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2.4rem;
            color: #8b6b4d;
            font-weight: 500;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #b19274;
            margin-top: 8px;
        }
        .quick-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .quick-link {
            background: white;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #f3ede6;
            text-decoration: none;
            color: #5d4636;
            transition: all 0.2s;
        }
        .quick-link:hover {
            border-color: #dbbd9a;
            transform: translateY(-2px);
        }
        .quick-link i {
            font-size: 1.5rem;
            color: #b2753c;
            margin-bottom: 12px;
        }
        .quick-link h3 { font-size: 1rem; font-weight: 500; margin-bottom: 4px; }
        .quick-link p { font-size: 0.8rem; color: #b19274; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>金刚般若<small>内容管理系统</small></h2>
        <a href="/admin/dashboard.html" class="nav-item active"><i class="fas fa-home"></i> 控制台</a>
        <a href="/admin/articles.html" class="nav-item"><i class="fas fa-book"></i> 文章管理</a>
        <a href="/admin/comments.html" class="nav-item"><i class="fas fa-comments"></i> 评论管理</a>
        <a href="#" class="nav-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
    </div>
    <div class="main">
        <h1>📊 控制台</h1>
        <div class="stats">
            <div class="stat-card"><div class="number" id="statArticles">-</div><div class="label">文章总数</div></div>
            <div class="stat-card"><div class="number" id="statComments">-</div><div class="label">评论总数</div></div>
            <div class="stat-card"><div class="number" id="statUnreplied">-</div><div class="label">待回复</div></div>
        </div>
        <h1 style="margin-top:48px">⚡ 快捷操作</h1>
        <div class="quick-links">
            <a href="/admin/articles.html" class="quick-link">
                <i class="fas fa-pen"></i><h3>写新文章</h3><p>发布修心感悟</p>
            </a>
            <a href="/admin/comments.html" class="quick-link">
                <i class="fas fa-reply"></i><h3>回复评论</h3><p>与同修交流</p>
            </a>
        </div>
    </div>
    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) { window.location.href = '/admin/index.html'; return; }
                const data = await res.json();
                document.getElementById('statArticles').textContent = data.articles;
                document.getElementById('statComments').textContent = data.comments;
                document.getElementById('statUnreplied').textContent = data.unreplied;
            } catch { window.location.href = '/admin/index.html'; }
        }
        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/admin/index.html';
        }
        loadStats();
    </script>
</body>
</html>
